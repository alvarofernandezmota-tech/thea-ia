# pytest.ini - Configuración de pytest para THEA IA
# Autor: Álvaro Fernández Mota
# Fecha: 04 Dic 2025 (H04 PHASE 2)

[pytest]
# ========================================
# PYTEST-ASYNCIO CONFIGURATION
# ========================================
# Modo automático para tests async (detecta automáticamente)
asyncio_mode = auto

# Scope por defecto para fixtures async (function = nuevo loop por test)
asyncio_default_fixture_loop_scope = function


# ========================================
# TEST DISCOVERY
# ========================================
# Directorio raíz de tests
testpaths = src/theaia/tests

# Patrón de archivos de test
python_files = test_*.py *_test.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*


# ========================================
# OUTPUT & REPORTING
# ========================================
# Mostrar output de print() durante tests
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src/theaia
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --maxfail=5
    --durations=10
    -p no:warnings


# ========================================
# MARKERS (para categorizar tests)
# ========================================
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (multiple components)
    e2e: End-to-end tests (full system)
    slow: Slow tests (skip with -m "not slow")
    database: Tests that require database
    external: Tests that require external services
    smoke: Smoke tests (critical path)


# ========================================
# COVERAGE SETTINGS
# ========================================
[coverage:run]
source = src/theaia
omit = 
    */tests/*
    */migrations/*
    */__pycache__/*
    */site-packages/*
    .venv/*

[coverage:report]
precision = 2
skip_empty = True
show_missing = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
